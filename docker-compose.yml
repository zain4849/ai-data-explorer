services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: explorer_secret
      POSTGRES_DB: data_explorer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer -d data_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development 
      DATABASE_URL: postgresql://explorer:explorer_secret@postgres:5432/data_explorer
      LLM_PROVIDER: gemini
      OLLAMA_URL: http://ollama:11434/api/generate
      SECRET_KEY: change-me-in-production-use-a-real-secret
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30" 
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      DEFAULT_QUERY_LIMIT: "100"
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  ollama:
